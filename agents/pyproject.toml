[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tim Garvin", email = "tcgarvin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.75.0",
    "bobgame-rules",
    "grpcio>=1.76.0",
    "httpx>=0.28",
    "grpcio-tools>=1.76.0",
    "structlog>=25.5.0",
    "typesafe-sdk>=0.6.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[openai]>=2.43.0",
    "tiktoken>=0.14",
]

[tool.uv.sources]
bobgame-rules = { path = "../rules", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0",
    "types-grpcio>=1.83.0.20260730",
    "types-protobuf>=7.35.1.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `evals/` is deliberately outside testpaths: those tests call the real Jev API
# and cost money, so `uv run pytest -q` must never reach them. Run them with
# `uv run pytest evals -q`.
testpaths = ["tests"]
# The repo root on the path, so `tests/test_openrouter_client.py` can import
# the eval backend in `evals/` (which is a package, but not an installed one).
pythonpath = ["."]
markers = [
    "jev_live: calls the live TypeSafe Jev API (evals/, needs TYPESAFE_API_KEY)",
]

[tool.mypy]
python_version = "3.13"
strict = true

# world_pb2_grpc.py is generated by protoc and carries no annotations, so the
# one module that builds stubs from it cannot be strict about untyped calls.
[[tool.mypy.overrides]]
module = "agents.jev_agent.client"
disallow_untyped_calls = false
