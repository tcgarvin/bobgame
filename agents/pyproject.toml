[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tim Garvin", email = "tcgarvin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.75.0",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "structlog>=25.5.0",
    "typesafe-sdk>=0.6.0",
    "pydantic>=2.0",
    "pydantic-ai-slim[openai]>=2.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0",
    "types-grpcio>=1.83.0.20260730",
    "types-protobuf>=7.35.1.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

# world_pb2_grpc.py is generated by protoc and carries no annotations, so the
# one module that builds stubs from it cannot be strict about untyped calls.
[[tool.mypy.overrides]]
module = "agents.jev_agent.client"
disallow_untyped_calls = false
