[project]
name = "bobgame-rules"
version = "0.1.0"
description = "The game's rules: kinds, recipes and constants, shared by world, agents, tools and the viewer generator."
readme = "README.md"
authors = [
    { name = "Tim Garvin", email = "tcgarvin@gmail.com" }
]
requires-python = ">=3.13"
# Deliberately empty: every consumer (world, agents, tools) depends on this
# package, so it must stay pure stdlib.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]

[tool.mypy]
python_version = "3.13"
strict = true
