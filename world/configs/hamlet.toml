# Hamlet experiment: six LLM-driven settlers on the big island, one wolf.
# A smaller, calmer variant of the settlement scenario: half the settlers and
# a single wolf that arrives from further out, so a group can live with it.
# See docs/05_jev_agents_design.md.
#
# Loads the pre-generated 4000x4000 island map and spawns every entity on the
# free walkable tiles nearest the computed settlement centre (x/y below are
# ignored in settlement spawn mode).

[world]
width = 4000
height = 4000
generation_mode = "load"
map_save_path = "saves/island.npz"
spawn_mode = "settlement"
wolves = true
max_wolves = 1
wolf_spawn_min_distance = 30
wolf_spawn_max_distance = 45
tick_duration_ms = 2000
intent_deadline_ms = 1200
# A day is 300 ticks = 10 minutes at 2 s ticks; nights start at tick 200.
day_length_ticks = 300

[[entities]]
id = "ada"
type = "player"
x = 0
y = 0

[[entities]]
id = "bram"
type = "player"
x = 0
y = 0

[[entities]]
id = "cleo"
type = "player"
x = 0
y = 0

[[entities]]
id = "dov"
type = "player"
x = 0
y = 0

[[entities]]
id = "esme"
