# Hamlet experiment: six LLM-driven settlers on the big island, one wolf.
# A smaller, calmer variant of the settlement scenario: half the settlers and
# a single wolf that arrives from further out, so a group can live with it.
# See docs/05_jev_agents_design.md.
#
# Uses the 4000x4000 island map: generation_mode = "generate" loads
# saves/island.npz when it exists and otherwise generates the map from
# terrain_seed and saves it there (2-5 minutes on a first run). The same map
# can be built ahead of time with `cd world && uv run python -m world.terrain`,
# whose defaults match the values below.
#
# Every entity spawns on the free walkable tiles nearest the computed
# settlement centre (the x/y below are ignored in settlement spawn mode).

[world]
width = 4000
height = 4000
generation_mode = "generate"
terrain_seed = 12345
map_save_path = "saves/island.npz"
spawn_mode = "settlement"
wolves = true
max_wolves = 1
wolf_spawn_min_distance = 30
wolf_spawn_max_distance = 45
# A killed wolf stays gone for a while: 120 ticks between spawn attempts.
wolf_spawn_interval_ticks = 120
tick_duration_ms = 2000
intent_deadline_ms = 1200
# A day is 300 ticks = 10 minutes at 2 s ticks; nights start at tick 200.
day_length_ticks = 300
# The new moon (docs/14_new_moon_and_saves.md): every third night everyone
# falls asleep at tick-of-day 200 and the run is saved three ticks later.
new_moon_every_days = 3
save_on_new_moon = true
save_wait_seconds = 180

[[entities]]
id = "ada"
type = "player"
x = 0
y = 0

