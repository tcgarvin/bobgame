<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bob's World - Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        color: #d8d8e0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      #app {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* --- HTML overlays on top of the Phaser canvas --- */
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #ui-root .panel {
        pointer-events: auto;
        background: rgba(16, 16, 22, 0.92);
        border: 1px solid #33334a;
        border-radius: 4px;
      }

      #entity-picker-box {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 6px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #entity-picker {
        background: #1b1b26;
        color: #d8d8e0;
        border: 1px solid #3a3a52;
        border-radius: 3px;
        font: inherit;
        padding: 2px 4px;
        min-width: 150px;
      }
      #follow-indicator {
        color: #7fd67f;
      }
      #follow-indicator.off {
        color: #8a8a9a;
      }

      #agent-panel {
        position: absolute;
        top: 48px;
        right: 8px;
        bottom: 48px;
        width: 320px;
        padding: 10px;
        overflow-y: auto;
        line-height: 1.4;
      }
      #agent-panel.hidden {
        display: none;
      }
      #agent-panel h2 {
        font-size: 14px;
        margin-bottom: 2px;
        color: #ffffff;
      }
      #agent-panel .section {
        margin-top: 10px;
        border-top: 1px solid #2a2a3c;
        padding-top: 6px;
      }
      #agent-panel .label {
        color: #8a8aa0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        margin-bottom: 2px;
      }
      #agent-panel .text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #agent-panel .muted {
        color: #6c6c80;
      }
      .mode-badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background: #3a3a52;
        color: #d8d8e0;
      }
      .mode-badge.planning {
        background: #35407a;
        color: #cdd8ff;
      }
      .mode-badge.stint {
        background: #2b5d3a;
        color: #c8f0d2;
      }
      .mode-badge.idle {
        background: #4a4a30;
        color: #eee7c0;
      }
      .mode-badge.reflex {
        background: #7a3535;
        color: #ffd8d8;
      }
      .mode-badge.conversation {
        background: #3a5d6b;
        color: #cdeef7;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 2px;
      }
      .bar-row .bar-label {
        flex: 0 0 110px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar-track {
        flex: 1 1 auto;
        height: 7px;
        background: #26263a;
        border-radius: 3px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: #5f8dd3;
      }
      .bar-row .bar-value {
        flex: 0 0 40px;
        text-align: right;
        color: #9a9ab0;
      }
      #agent-panel ul {
        list-style: none;
      }
      #agent-panel li {
        padding: 1px 0;
        overflow-wrap: anywhere;
      }
      li.fail {
        color: #e07a7a;
      }
      li.utterance {
        color: #8fd3e8;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .kv span:last-child {
        color: #ffffff;
        text-align: right;
        overflow-wrap: anywhere;
      }
      .hidden {
        display: none !important;
      }

      /* --- Replay: agent panel extras --- */
      .bar-row.chosen .bar-label {
        color: #ffffff;
        font-weight: bold;
      }
      #agent-panel details,
      #object-panel details {
        margin-top: 4px;
      }
      #agent-panel summary {
        cursor: pointer;
        color: #8a8aa0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        padding: 2px 0;
      }
      #agent-panel details.sub summary {
        text-transform: none;
        letter-spacing: 0;
        font-size: 11px;
        color: #9fb4d8;
      }
      pre.json {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #101018;
        border: 1px solid #26263a;
        border-radius: 3px;
        padding: 4px;
        margin: 2px 0;
        max-height: 240px;
        overflow-y: auto;
        color: #b8c4d8;
        font-size: 11px;
      }

      /* --- Object inspector --- */
      #object-panel {
        position: absolute;
        left: 8px;
        top: 96px;
        width: 300px;
        max-height: 45vh;
        overflow-y: auto;
        padding: 10px;
        line-height: 1.4;
      }
      #object-panel h2 {
        font-size: 13px;
        color: #ffffff;
        display: inline-block;
      }
      #object-panel .label {
        color: #8a8aa0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        margin: 8px 0 2px;
        border-top: 1px solid #2a2a3c;
        padding-top: 6px;
      }
      #object-panel .muted {
        color: #6c6c80;
      }
      #op-close {
        float: right;
      }
      .note {
        border-left: 2px solid #3a3a52;
        padding-left: 6px;
        margin-bottom: 6px;
      }
      .note-head {
        color: #ffffff;
      }
      .note-meta {
        color: #6c6c80;
        font-size: 10px;
      }
      .note-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      /* --- Replay transport bar --- */
      #replay-bar {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      #rb-transport {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #rb-run {
        color: #9fb4d8;
      }
      #rb-bounds {
        color: #6c6c80;
      }
      #ui-root button,
      #ui-root select,
      #ui-root input {
        background: #1b1b26;
        color: #d8d8e0;
        border: 1px solid #3a3a52;
        border-radius: 3px;
        font: inherit;
        padding: 2px 6px;
        cursor: pointer;
        white-space: nowrap;
      }
      #ui-root button:hover {
        background: #26263a;
      }
      #rb-tick {
        width: 72px;
        cursor: text;
      }
      #rb-slider {
        width: 260px;
        padding: 0;
      }
      #rb-events {
        max-width: 220px;
      }
      #rb-play {
        min-width: 52px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-root">
      <div id="entity-picker-box" class="panel">
        <label for="entity-picker">Entity</label>
        <select id="entity-picker">
          <option value="">(none)</option>
        </select>
        <span id="follow-indicator" class="off">follow off</span>
      </div>
      <div id="agent-panel" class="panel">
        <h2 id="ap-name">No entity selected</h2>
        <div><span id="ap-mode" class="mode-badge">idle</span></div>

        <div class="section">
          <div class="label">Stats</div>
          <div id="ap-stats"></div>
        </div>

        <div class="section">
          <div class="label">Brief</div>
          <div id="ap-brief" class="text muted">-</div>
          <div id="ap-brief-meta"></div>
        </div>

        <div id="ap-conversation" class="section hidden">
          <div class="label">Conversation</div>
          <div id="ap-conversation-body"></div>
        </div>

        <div class="section">
          <div class="label">Planner thought</div>
          <div id="ap-thought" class="text muted">-</div>
        </div>

        <div class="section">
          <div class="label">Last Jev decision</div>
          <div id="ap-jev" class="text muted">-</div>
        </div>

        <div class="section">
          <div class="label">Inventory</div>
          <div id="ap-inventory" class="text muted">-</div>
        </div>

        <div class="section">
          <div class="label">Recent (newest first)</div>
          <ul id="ap-log">
            <li class="muted">-</li>
          </ul>
        </div>

        <div id="ap-replay" class="section hidden">
          <details>
            <summary>What Jev saw</summary>
            <div id="ap-jev-state"></div>
          </details>
          <details>
            <summary>Planner turn</summary>
            <div id="ap-planner"></div>
          </details>
          <details>
            <summary>Memory</summary>
            <div id="ap-memory"></div>
          </details>
        </div>
      </div>

      <div id="object-panel" class="panel hidden">
        <h2 id="op-title">object</h2>
        <button id="op-close" type="button">close</button>
        <div id="op-body"></div>
      </div>

      <div id="replay-bar" class="panel">
        <span id="rb-run" class="hidden">-</span>
        <div id="rb-transport" class="hidden">
          <button id="rb-start" type="button" title="jump to start">|&lt;</button>
          <button id="rb-back10" type="button" title="back 10 ticks">-10</button>
          <button id="rb-back1" type="button" title="back 1 tick">-1</button>
          <button id="rb-play" type="button" title="play/pause (space)">play</button>
          <button id="rb-fwd1" type="button" title="forward 1 tick">+1</button>
          <button id="rb-fwd10" type="button" title="forward 10 ticks">+10</button>
          <button id="rb-end" type="button" title="jump to end">&gt;|</button>
          <input id="rb-tick" type="number" step="1" value="0" title="tick" />
          <input id="rb-slider" type="range" min="0" max="0" value="0" />
          <span id="rb-bounds">0-0</span>
          <select id="rb-speed" title="playback speed"></select>
          <select id="rb-events" title="notable events">
            <option value="">events</option>
          </select>
        </div>
        <button id="rb-copy" type="button" title="copy a deep link to this moment">
          copy link
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
